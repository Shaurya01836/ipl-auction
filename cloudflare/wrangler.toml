name = "crickauction-api"
main = "worker.js"
compatibility_date = "2024-11-01"

[observability.logs]
enabled = true
invocation_logs = true
persist = true

# Bind Cloudflare D1 database
[[d1_databases]]
binding = "DB"
database_name = "crickauction-db"
database_id = "4ca10b3a-3ca8-46dd-937d-bc9a13b39ac1"

# Automated Midnight Reset (18:30 UTC = 00:00:00 IST every day)
[triggers]
crons = ["30 18 * * *"]


